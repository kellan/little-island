name: Playable PR preview
on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
permissions:
  contents: write
  pull-requests: write
  deployments: read
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: github.event.action != 'closed'
        with:
          node-version: 22
          cache: npm
      # Correctness is gated by the Check pull request workflow on this same
      # commit. Repeating it here doubled the minutes for every push to a PR.
      - if: github.event.action != 'closed'
        run: npm ci && npm run build
      - uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9
        with:
          source-dir: dist
          preview-branch: gh-pages
          qr-code: false
          comment: false
      - if: github.event.action != 'closed'
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: echo "Play preview at https://kellan.github.io/little-island/pr-preview/pr-${PR_NUMBER}/" >> "$GITHUB_STEP_SUMMARY"
