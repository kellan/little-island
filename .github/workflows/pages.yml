name: Publish island
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages-production
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      # The browser run gates the deploy: the built page is the whole deliverable.
      - run: npm run e2e
      - run: npm run build
      - run: npx playwright install --with-deps chromium-headless-shell
      - run: npm run test:browser
      - uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445
        with:
          folder: dist
          branch: gh-pages
          clean-exclude: pr-preview
      - run: echo 'Play at https://kellan.github.io/little-island/' >> "$GITHUB_STEP_SUMMARY"
